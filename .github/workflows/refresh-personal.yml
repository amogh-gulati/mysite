# Rebuilds the site daily on Render so the Letterboxd/Spotify section and
# palette stay fresh. Requires the repo secret RENDER_DEPLOY_HOOK_URL
# (Render dashboard → the site → Settings → Deploy Hook).
name: Refresh personal data

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL secret not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
